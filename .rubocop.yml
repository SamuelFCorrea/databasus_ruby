AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The API surface is keyword-argument based, and keyword arguments do not have
# the readability problem this cop guards against.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Gemspec/DevelopmentDependencies:
  EnforcedStyle: Gemfile

# `acknowledged` converts a bodyless 200/204 into a return value; it reads as a
# transformation at the call site, not as a question.
Naming/PredicateMethod:
  AllowedMethods:
    - acknowledged

# Request payloads are written as one hash literal per call; a long literal is
# still one statement.
Metrics/MethodLength:
  CountAsOne: ["hash", "array"]
